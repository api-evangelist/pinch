aid: pinch

name: Pinch

image: https://cdn.sanity.io/images/98lcnac0/production/0a4bcd959a4eab98b8cf8add62ab1244db0c6462-4000x2667.jpg

description: Pinch provides an at‑home medical spa experience combined with a payments platform that enables businesses to accept online payments
  for aesthetic treatments. The company offers a suite of APIs for managing customers, processing credit‑card and direct‑debit transactions, handling
  subscriptions, and integrating with third‑party services. Documentation includes guides, reference API specs, and SDKs for multiple languages,
  supporting developers to build seamless checkout flows for health‑and‑beauty services.

