components:
  schemas:
    PostCalculateFeesRequest:
      type: object
      properties:
        amount:
          type: integer
          description: The gross payment amount in cents
        sourceType:
          type: string
          description: The expected payment method (e.g., credit-card)
      required:
      - amount
      - sourceType
    PostCalculateFeesResponse:
      type: object
      properties:
        amount:
          type: integer
          description: The gross payment amount in cents
        feeAmount:
          type: integer
          description: The total processing fee in cents (includes GST)
        taxAmount:
          type: integer
          description: The GST component of the fee, in cents
        netAmount:
          type: integer
          description: What will be settled to your account after fees
    PostConnectTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
    GetFeesCalculateResponse:
      type: object
      properties:
        amount:
          type: integer
        fee:
          type: integer
        total:
          type: integer
    PostMerchantsMerchantidRequest:
      type: object
      properties:
        companyName:
          type: string
        contactFirstName:
          type: string
        contactLastName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        abn:
          type: string
      required:
      - companyName
      - contactFirstName
      - contactLastName
      - contactEmail
      - contactPhone
      - abn
    PostPayersPayeridSourcesRequest:
      type: object
      properties:
        token:
          type: string
          description: Short‑lived token returned by CaptureJS
      required:
      - token
    PostPaymentsRequest:
      type: object
      properties:
        token:
          type: string
          description: Short‑lived token returned by CaptureJS
      required:
      - token
    PostPaymentsRealtimeRequest:
      type: object
      properties:
        token:
          type: string
          description: Short‑lived token returned by CaptureJS
      required:
      - token
    GetPlansResponse:
      type: object
      properties:
        plans:
          type: array
          description: Paginated list of plans
    PostPlansRequest:
      type: object
      properties:
        id:
          type: string
          description: If present, updates the existing plan; if empty, creates a new plan
        name:
          type: string
          description: Name of the plan
        payments:
          type: string
          description: Definition of fixed or recurring payments
      required:
      - name
      - payments
    PostPlansResponse:
      type: object
      properties:
        plan:
          type: object
          description: Created or updated plan
    GetPlansPlanidResponse:
      type: object
      properties:
        plan:
          type: object
          description: Details of the requested plan
    PostRefundsRequest:
      type: object
      properties:
        paymentId:
          type: string
          description: ID of the payment to refund
        amount:
          type: integer
          description: Refund amount in cents
        reason:
          type: string
          description: Reason for the refund
        nonce:
          type: string
          description: Idempotency key to prevent duplicate refunds
      required:
      - paymentId
      - amount
      - reason
    PostRefundsResponse:
      type: object
      properties:
        refundFeeCharged:
          type: integer
          description: The fee amount (in cents) that was not returned as part of this refund
        refundedFees:
          type: integer
          description: Any fees that were returned (if applicable)
    PostRefundsNonceRequest:
      type: object
      properties:
        nonce:
          type: string
          description: Replay protection key to check if already processed
      required:
      - nonce
    PostSourcesRequest:
      type: object
      properties:
        payerId:
          type: string
        token:
          type: string
      required:
      - payerId
      - token
    PostSourcesResponse:
      type: object
      properties:
        id:
          type: string
        payerId:
          type: string
        sourceType:
          type: string
        last4:
          type: string
        expiryMonth:
          type: integer
        expiryYear:
          type: integer
    GetSubscriptionsResponse:
      type: object
      properties:
        subscriptions:
          type: array
          description: Paginated list of subscriptions
    PostSubscriptionsRequest:
      type: object
      properties:
        planId:
          type: string
          description: Identifier of the plan to subscribe to
        payerId:
          type: string
          description: Identifier of the payer (customer)
        totalAmount:
          type: string
          description: Total amount in cents when required by the plan
        startDate:
          type: string
          description: Start date of the subscription
        currency:
          type: string
          description: Currency code
        sourceId:
          type: string
          description: Payment source identifier
      required:
      - planId
      - payerId
    PostSubscriptionsResponse:
      type: object
      properties:
        subscription:
          type: object
          description: Created subscription instance
    GetSubscriptionsPayerPayeridResponse:
      type: object
      properties:
        subscriptions:
          type: array
          description: Subscriptions belonging to the payer
    GetSubscriptionsPlanPlanidResponse:
      type: object
      properties:
        subscriptions:
          type: array
          description: Subscriptions attached to the plan
    GetTestPlansPlnXxxxxxxxCalculatedPaymentsResponse:
      type: object
      properties:
        payments:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              amount:
                type: integer
    PostTestTestidResponse:
      type: object
      properties:
        amount:
          type: integer
        feeAmount:
          type: integer
        taxAmount:
          type: integer
        netAmount:
          type: integer
    PostWebhooksRequest:
      type: object
      properties:
        url:
          type: string
        eventTypes:
          type: string
        format:
          type: string
      required:
      - url
      - eventTypes
      - format
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
security:
- apiKey: []
tags:
- name: Calculate Fees
- name: Connect
- name: Fees
- name: Merchants
- name: Payers
- name: Payment Links
- name: Payments
- name: Plans
- name: Refund
- name: Refunds
- name: Sources
- name: Subscriptions
- name: Test
- name: Transfers
- name: Webhooks
